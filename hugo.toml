baseURL = "/"
# Each version is served under its own path prefix (/v0.3/, /main/), so a
# root-relative link written as /getting-started/ would escape the version it
# was written for. canonifyURLs resolves every such link against baseURL, which
# already carries the prefix. It is what makes archived versions work at all:
# their content is frozen at a release commit and can't be edited to know about
# prefixes. (relativeURLs looks like the same fix but breaks the asset
# pipeline's URLs - it fails htmltest with thousands of errors.) See
# nix/docs.nix.
canonifyURLs = true
languageCode = "en-us"
title = "Modelplane Docs"
theme = "geekboot"
enableRobotsTXT = true
# Git metadata for last-modified dates. Content lives in the modelplane
# submodule, which this repo's git history doesn't cover, so pages get no
# git dates. Production builds already set HUGO_ENABLEGITINFO=false.
enableGitInfo = true

disableKinds = ["taxonomy", "term"]
ignoreFiles = ["themes/geekboot/content/.*", "README.md"]

[outputs]
  home = ["html", "llms", "llmsfull", "llmsjson"]
  section = ["html", "rss", "markdown"]
  page = ["html", "markdown"]

# Machine-readable variants for AI agents and LLM tools. The markdown format
# emits a raw-Markdown sibling of every page (page/index.md); the home page also
# emits llms.txt (an index), llms-full.txt (every page concatenated), and
# llms.json (the corpus the docs MCP server searches). See content/ai-tools.md.
[outputFormats]
  [outputFormats.markdown]
    mediaType = "text/markdown"
    isPlainText = true
    isHTML = false
    permalinkable = true
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
  [outputFormats.llmsjson]
    mediaType = "application/json"
    baseName = "llms"
    isPlainText = true


[build]
  # Emit hugo_stats.json listing the tags, classes, and IDs the site uses.
  # PurgeCSS reads it to strip unused CSS rules. See postcss.config.js.
  [build.buildStats]
    enable = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9
  [markup.highlight]
    codeFences = true
    noClasses = false
    linenos = false
    anchorLineNos = false
    lineNumbersInTable = false

[module]
  # Content, example manifests, and API definitions live in the modelplane
  # repo, pulled in as the modelplane/ submodule. Everything else - layouts,
  # the theme, the data that groups the API reference - is local to this repo.
  [[module.mounts]]
    source = "modelplane/docs/content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "modelplane/docs/content"
    target = "assets/content"
    includeFiles = ["**/**.png", "**/**.jpg", "**/**.jpeg", "**/**.gif"]
  # Defining any data mount below suppresses Hugo's default data mount, so mount
  # the local data dir explicitly (holds apigroups.yaml, which groups the API
  # reference). Accessible as site.Data.apigroups.
  [[module.mounts]]
    source = "data"
    target = "data"
  # Mount the APIs directory as Hugo data so the reference partials can read
  # definition.yaml files without a separate generation step.
  # Accessible as site.Data.apis.crds.<plural>.definition
  [[module.mounts]]
    source = "modelplane/apis"
    target = "data/apis/crds"
  # Also mount it as assets so the Markdown output can emit the raw definition.yaml
  # verbatim (comments preserved) via resources.Get "apis/<plural>/definition.yaml".
  [[module.mounts]]
    source = "modelplane/apis"
    target = "assets/apis"
  # Mount the manifests directory as assets so the manifests shortcode can read
  # raw YAML (preserving comments) via resources.Get "examples/<path>.yaml". The
  # files live under modelplane/docs/manifests/<section>/, one subtree per docs
  # section.
  [[module.mounts]]
    source = "modelplane/docs/manifests"
    target = "assets/examples"

[security]
  [security.funcs]
    getenv = ["^CONTEXT", "^REVIEW_ID", "^VERCEL_ENV"]
  [security.node.permissions]
    # Hugo runs Node tools under Node's permission model, which blocks
    # native addons unless the tool is listed here. The PostCSS pipeline
    # needs it: LightningCSS is a native addon. "tailwindcss" is Hugo's
    # default; keep it when overriding the list.
    allowAddons = ["postcss", "tailwindcss"]
    # PostCSS resolves its plugins through NODE_PATH, which points at a
    # node_modules that Nix builds and the derivation symlinks in. Node resolves
    # a symlink to its real path before checking permissions, so Hugo's default
    # allowRead of ["."] - the project directory - doesn't reach it. Granting
    # the store keeps the read confined to content Nix put there. See
    # nix/docs.nix.
    allowRead = [".", "/nix/store"]

[params]
  docs = true
  description = "Modelplane documentation."
  # Which version this build is. nix/docs.nix overrides it per version; the
  # value here is what `hugo server` uses, where the only content on disk is the
  # modelplane/ submodule - that is, main.
  version = "main"
  # params.versioned is set only by nix/docs.nix, which builds every version into
  # one artifact. `hugo server` serves one version at the root, so the switcher
  # and the older-version banners would point at paths that do not exist there;
  # they render only when this is set. The latest release is read from
  # data/versions.json, so there is one source for it.
  [params.anchors]
    min = 2
    max = 5
