name: Update content

# Bump every version's content pin to the tip of the branch it tracks: the
# modelplane submodule for main, and one flake input per archived version.
# Merging the resulting commit is what ships new prose - this repo pins content
# commits, so content changes are invisible to the site until the pins move.
#
# This is why archived docs need no release branch here and no backport: a fix
# landed on the content repo's release-0.3 reaches the site through this job,
# the same way a fix on main does.
#
# Runs daily and on demand. The content repo can also trigger it right after a
# merge:
#   gh workflow run content.yml --repo tr0njavolta/modelplane-docs
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bump every content pin
        id: bump
        run: |
          git submodule update --remote modelplane

          # Every archived version is a flake input named content-<version>.
          # Reading them out of the lock file keeps this job correct when a
          # version is added, with no edit here.
          archived=$(jq -r '.nodes.root.inputs | keys[]
            | select(startswith("content-"))' flake.lock)
          if [ -n "$archived" ]; then
            # shellcheck disable=SC2086
            nix flake update $archived
          fi

          if git diff --quiet -- modelplane flake.lock; then
            echo "Every version is already at the tip of its branch."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C modelplane rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # A PR rather than a push to main, so the site build runs against the new
      # content before it deploys.
      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content-update
          title: "Update docs content to ${{ steps.bump.outputs.sha }}"
          body: >-
            Moves main's content to ${{ steps.bump.outputs.sha }} and every
            archived version to the tip of its release branch. CI builds all of
            them against these pins.
          commit-message: "Update docs content to ${{ steps.bump.outputs.sha }}"
