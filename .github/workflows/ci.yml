name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

# Cancel in-progress runs for the same PR. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      # The site has no content without the modelplane submodule, and the nix
      # build refuses to run with it empty.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: log-lines = 500

      # Cache Nix store paths in the GitHub Actions cache so builds reuse work
      # across runs. use-flakehub is off so artifacts stay in the Actions cache
      # rather than going to a third party.
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      # Nix only sees a flake's submodules when asked, and without them the
      # check builds an empty site.
      - name: Check
        run: nix flake check '.?submodules=1' --print-build-logs
